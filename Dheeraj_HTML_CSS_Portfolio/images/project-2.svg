<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="p2Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="#f1f5f9" />

  <!-- App Window Frame -->
  <g transform="translate(30, 25)" filter="url(#p2Shadow)">
    <rect width="540" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Top Window Controls -->
    <rect width="540" height="40" rx="12" fill="#0f172a" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <text x="90" y="24" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8">TaskFlow Productivity Dashboard</text>

    <!-- Sidebar -->
    <rect x="0" y="40" width="120" height="290" fill="#1e293b" />
    <rect x="18" y="60" width="84" height="12" rx="4" fill="#38bdf8" />
    <rect x="18" y="85" width="70" height="8" rx="3" fill="#64748b" />
    <rect x="18" y="105" width="60" height="8" rx="3" fill="#64748b" />
    <rect x="18" y="125" width="75" height="8" rx="3" fill="#64748b" />
    <rect x="18" y="145" width="55" height="8" rx="3" fill="#64748b" />

    <!-- Main Content Area -->
    <g transform="translate(135, 55)">
      <!-- Stats widgets row -->
      <g transform="translate(0, 0)">
        <rect width="120" height="65" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
        <rect x="12" y="12" width="60" height="8" rx="2" fill="#0369a1" />
        <text x="12" y="45" font-family="sans-serif" font-weight="bold" font-size="20" fill="#0284c7">24 / 28</text>
      </g>
      <g transform="translate(132, 0)">
        <rect width="120" height="65" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
        <rect x="12" y="12" width="60" height="8" rx="2" fill="#15803d" />
        <text x="12" y="45" font-family="sans-serif" font-weight="bold" font-size="20" fill="#16a34a">86%</text>
      </g>
      <g transform="translate(264, 0)">
        <rect width="120" height="65" rx="8" fill="#faf5ff" stroke="#e9d5ff" />
        <rect x="12" y="12" width="60" height="8" rx="2" fill="#7e22ce" />
        <text x="12" y="45" font-family="sans-serif" font-weight="bold" font-size="20" fill="#9333ea">14 Days</text>
      </g>

      <!-- Task items list mockup -->
      <g transform="translate(0, 80)">
        <!-- Task 1 -->
        <rect width="385" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <circle cx="20" cy="21" r="7" fill="#10b981" />
        <path d="M 17 21 L 19 23 L 23 19" fill="none" stroke="#fff" stroke-width="1.5" />
        <rect x="36" y="16" width="160" height="10" rx="3" fill="#334155" />
        <rect x="320" y="13" width="50" height="16" rx="4" fill="#dcfce7" />

        <!-- Task 2 -->
        <rect y="50" width="385" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <circle cx="20" cy="71" r="7" fill="#10b981" />
        <path d="M 17 71 L 19 73 L 23 69" fill="none" stroke="#fff" stroke-width="1.5" />
        <rect x="36" y="66" width="190" height="10" rx="3" fill="#334155" />
        <rect x="320" y="63" width="50" height="16" rx="4" fill="#e0e7ff" />

        <!-- Task 3 -->
        <rect y="100" width="385" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <circle cx="20" cy="121" r="7" fill="none" stroke="#94a3b8" stroke-width="2" />
        <rect x="36" y="116" width="140" height="10" rx="3" fill="#1e293b" />
        <rect x="320" y="113" width="50" height="16" rx="4" fill="#fee2e2" />

        <!-- Task 4 -->
        <rect y="150" width="385" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" />
        <circle cx="20" cy="171" r="7" fill="none" stroke="#94a3b8" stroke-width="2" />
        <rect x="36" y="166" width="175" height="10" rx="3" fill="#1e293b" />
        <rect x="320" y="163" width="50" height="16" rx="4" fill="#fef3c7" />
      </g>
    </g>
  </g>
</svg>