<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="p1Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="#f1f5f9" />
  
  <!-- Browser Frame -->
  <g transform="translate(30, 25)" filter="url(#p1Shadow)">
    <rect width="540" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Browser Top Bar -->
    <rect width="540" height="40" rx="12" fill="#f8fafc" />
    <path d="M 0 40 L 540 40" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <!-- URL search bar mock -->
    <rect x="90" y="10" width="360" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0" />
    <text x="105" y="24" font-family="monospace" font-size="11" fill="#94a3b8">https://novakart-shop.demo</text>

    <!-- App Header inside browser -->
    <rect x="20" y="55" width="80" height="18" rx="4" fill="#4f46e5" />
    <rect x="360" y="58" width="40" height="12" rx="3" fill="#cbd5e1" />
    <rect x="415" y="58" width="40" height="12" rx="3" fill="#cbd5e1" />
    <rect x="470" y="55" width="50" height="18" rx="4" fill="#10b981" />

    <!-- Hero Promo Banner -->
    <rect x="20" y="85" width="500" height="85" rx="8" fill="url(#p1Grad)" />
    <rect x="40" y="105" width="160" height="16" rx="4" fill="#ffffff" />
    <rect x="40" y="128" width="100" height="10" rx="3" fill="#c7d2fe" />
    <rect x="40" y="145" width="70" height="15" rx="4" fill="#fbbf24" />

    <!-- Product Grid Mockup -->
    <!-- Card 1 -->
    <g transform="translate(20, 185)">
      <rect width="155" height="125" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="15" y="12" width="125" height="55" rx="6" fill="#e0e7ff" />
      <circle cx="77" cy="39" r="16" fill="#6366f1" opacity="0.6" />
      <rect x="15" y="75" width="85" height="10" rx="3" fill="#334155" />
      <rect x="15" y="92" width="40" height="10" rx="3" fill="#0ea5e9" />
      <rect x="105" y="88" width="35" height="18" rx="4" fill="#4f46e5" />
    </g>

    <!-- Card 2 -->
    <g transform="translate(192, 185)">
      <rect width="155" height="125" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="15" y="12" width="125" height="55" rx="6" fill="#fef3c7" />
      <circle cx="77" cy="39" r="16" fill="#f59e0b" opacity="0.6" />
      <rect x="15" y="75" width="95" height="10" rx="3" fill="#334155" />
      <rect x="15" y="92" width="40" height="10" rx="3" fill="#0ea5e9" />
      <rect x="105" y="88" width="35" height="18" rx="4" fill="#4f46e5" />
    </g>

    <!-- Card 3 -->
    <g transform="translate(365, 185)">
      <rect width="155" height="125" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="15" y="12" width="125" height="55" rx="6" fill="#dcfce7" />
      <circle cx="77" cy="39" r="16" fill="#10b981" opacity="0.6" />
      <rect x="15" y="75" width="75" height="10" rx="3" fill="#334155" />
      <rect x="15" y="92" width="40" height="10" rx="3" fill="#0ea5e9" />
      <rect x="105" y="88" width="35" height="18" rx="4" fill="#4f46e5" />
    </g>
  </g>
</svg>