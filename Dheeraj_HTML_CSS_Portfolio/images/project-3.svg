<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="p3Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="#f1f5f9" />

  <g transform="translate(30, 25)" filter="url(#p3Shadow)">
    <rect width="540" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Window top -->
    <rect width="540" height="40" rx="12" fill="#f8fafc" />
    <path d="M 0 40 L 540 40" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <rect x="90" y="10" width="360" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0" />
    <text x="105" y="24" font-family="monospace" font-size="11" fill="#94a3b8">https://clima-weather.demo</text>

    <!-- Weather Main Widget Hero -->
    <rect x="25" y="60" width="490" height="135" rx="10" fill="url(#p3Bg)" />
    <!-- Sun & Cloud -->
    <circle cx="430" cy="115" r="32" fill="#fbbf24" />
    <path d="M 390 145 C 385 130 400 115 420 118 C 428 102 455 102 465 118 C 478 120 485 132 480 145 Z" fill="#ffffff" opacity="0.9" />

    <text x="55" y="100" font-family="sans-serif" font-weight="600" font-size="18" fill="#bae6fd">San Francisco, CA</text>
    <text x="55" y="150" font-family="sans-serif" font-weight="800" font-size="44" fill="#ffffff">72°F</text>
    <text x="175" y="145" font-family="sans-serif" font-size="14" fill="#e0f2fe">Partly Cloudy • Humidity 48%</text>

    <!-- 4 Day Forecast Cards -->
    <g transform="translate(25, 212)">
      <!-- Day 1 -->
      <rect width="112" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="56" y="26" font-family="sans-serif" font-weight="600" font-size="12" fill="#475569" text-anchor="middle">MON</text>
      <circle cx="56" cy="52" r="14" fill="#f59e0b" />
      <text x="56" y="84" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1e293b" text-anchor="middle">74° / 58°</text>

      <!-- Day 2 -->
      <g transform="translate(126, 0)">
        <rect width="112" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="56" y="26" font-family="sans-serif" font-weight="600" font-size="12" fill="#475569" text-anchor="middle">TUE</text>
        <circle cx="50" cy="50" r="12" fill="#38bdf8" />
        <circle cx="62" cy="54" r="10" fill="#94a3b8" />
        <text x="56" y="84" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1e293b" text-anchor="middle">68° / 55°</text>
      </g>

      <!-- Day 3 -->
      <g transform="translate(252, 0)">
        <rect width="112" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="56" y="26" font-family="sans-serif" font-weight="600" font-size="12" fill="#475569" text-anchor="middle">WED</text>
        <circle cx="56" cy="52" r="14" fill="#f59e0b" />
        <text x="56" y="84" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1e293b" text-anchor="middle">76° / 60°</text>
      </g>

      <!-- Day 4 -->
      <g transform="translate(378, 0)">
        <rect width="112" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="56" y="26" font-family="sans-serif" font-weight="600" font-size="12" fill="#475569" text-anchor="middle">THU</text>
        <circle cx="56" cy="52" r="14" fill="#0284c7" />
        <text x="56" y="84" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1e293b" text-anchor="middle">70° / 54°</text>
      </g>
    </g>
  </g>
</svg>